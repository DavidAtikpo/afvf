<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="none">
  <defs>
    <filter id="afvfSmoke" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.055 0.14" numOctaves="4" seed="4" result="noise">
        <animate attributeName="seed" values="4;38;15;52;4" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="baseFrequency" values="0.05 0.12;0.07 0.16;0.045 0.11;0.05 0.12" dur="12s" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix in="noise" type="matrix" values="
        0 0 0 0 0.03
        0 0 0 0 0.09
        0 0 0 0 0.38
        0 0 0 1.15 -0.42" result="blue"/>
      <feGaussianBlur in="blue" stdDeviation="1.2" result="soft"/>
    </filter>
    <linearGradient id="afvfSmokeBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040810"/>
      <stop offset="45%" stop-color="#0a1a38"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#afvfSmokeBase)"/>
  <rect width="800" height="400" filter="url(#afvfSmoke)" opacity="0.92"/>
</svg>
